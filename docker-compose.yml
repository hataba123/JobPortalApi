services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the environment}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  aspnet-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - cv-data:/app/private-data/cv
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=JobPortal;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the environment}
      Jwt__Issuer: ${JWT_ISSUER:-JobPortal}
      Jwt__Audience: ${JWT_AUDIENCE:-JobPortalClient}
      OAuth__ExchangeSecret: ${OAUTH_EXCHANGE_SECRET:?Set OAUTH_EXCHANGE_SECRET in the environment}
      Vnpay__TmnCode: ${VNPAY_TMN_CODE:?Set VNPAY_TMN_CODE in the environment}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET:?Set VNPAY_HASH_SECRET in the environment}
      Vnpay__ReturnUrl: ${VNPAY_RETURN_URL:-http://localhost:3000/vi/payment/return}
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ../jobportal-fe
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://aspnet-api:8080/api
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in the environment}
      OAUTH_EXCHANGE_SECRET: ${OAUTH_EXCHANGE_SECRET:?Set OAUTH_EXCHANGE_SECRET in the environment}
    depends_on:
      aspnet-api:
        condition: service_started

volumes:
  sqlserver-data:
  cv-data:
